<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乗り過ごし防止</title>
</head>

<body>

    <h1>乗り過ごし防止</h1>

    <p>降りる駅を選んでください</p>


<select id="stationSelect">
    <option value="新宿駅">新宿駅</option>
    <option value="渋谷駅">渋谷駅</option>
    <option value="東京駅">東京駅</option>
    <option value="池袋駅">池袋駅</option>
    <option value="立川駅">立川駅</option>
</select>

    <br><br>

    <button onclick="startMonitoring()">監視を開始</button>


    <button onclick="getLocation()">現在地を取得</button>


    <button onclick="testAlert()">警告をテスト</button>


    <button onclick="testDistance()">距離判定をテスト</button>

    <br><br>

    <input type="number" id="testDistance" value="2">

    <button onclick="testDistanceWithKm()">距離をテスト</button>


    <p id="location">現在地：まだ取得していません</p>

    <script>
        const stations = {
    "新宿駅": {
        latitude: 35.6896,
        longitude: 139.7006
    },
    "渋谷駅": {
        latitude: 35.6580,
        longitude: 139.7016
    },
    "東京駅": {
        latitude: 35.6812,
        longitude: 139.7671
    },
    "池袋駅": {
        latitude: 35.7295,
        longitude: 139.7109
    },
    "立川駅": {
    latitude: 35.69789,
    longitude: 139.41394
    }
};
let watchId;
let alerted = false;


function startMonitoring() {
    alerted = false;


    if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(showPosition);
        alert("監視を開始しました！");
    } else {
        alert("このブラウザでは位置情報を取得できません。");
    }
}


    function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition);
    } else {
        alert("このブラウザでは位置情報を取得できません。");
    }
}

function showPosition(position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    const selectedStation = document.getElementById("stationSelect").value;
    const station = stations[selectedStation];

    const distance = calculateDistance(
        latitude,
        longitude,
        station.latitude,
        station.longitude
    );

    document.getElementById("location").innerText =
        "現在地：緯度 " + latitude +
        " / 経度 " + longitude +
        "\n" + selectedStation + "まで約 " +
        distance.toFixed(2) + " km";
    

    if (distance <= 1 && !alerted) {
    alert("🚨 まもなく" + selectedStation + "です！");
    alerted = true;
    }
}


function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
}


    function testAlert() {
    const selectedStation = document.getElementById("stationSelect").value;

    alert("🚨 まもなく" + selectedStation + "です！");
    }


    function testDistance() {
    const selectedStation = document.getElementById("stationSelect").value;
    const station = stations[selectedStation];

    const testLatitude = station.latitude;
    const testLongitude = station.longitude;

    const distance = calculateDistance(
        testLatitude,
        testLongitude,
        station.latitude,
        station.longitude
    );

    document.getElementById("location").innerText =
        selectedStation + "まで約 " + distance.toFixed(2) + " km";

    if (distance <= 1 && !alerted) {
        alert("🚨 まもなく" + selectedStation + "です！");
        alerted = true;
    }
    }


    function testDistanceWithKm() {
    const selectedStation = document.getElementById("stationSelect").value;
    const station = stations[selectedStation];

    const testDistance = Number(
        document.getElementById("testDistance").value
    );

    document.getElementById("location").innerText =
        selectedStation + "まで約 " + testDistance.toFixed(2) + " km";

    if (testDistance <= 1 && !alerted) {
    playAlertSound();
    alert("🚨 まもなく" + selectedStation + "です！");
    alerted = true;
    }
}


function playAlertSound() {
    const audioContext = new AudioContext();

    const oscillator = audioContext.createOscillator();

    oscillator.frequency.value = 880;

    oscillator.connect(audioContext.destination);

    oscillator.start();

    setTimeout(function() {
        oscillator.stop();
    }, 500);
}
    </script>


</body>
</html>
